---
apiVersion: pgbackrest.dalibo.com/v1
kind: Stanza
metadata:
  name: stanza-multi-repositories
spec:
  stanzaConfiguration:
    name: main
    s3Repositories:
      - bucket: pgbackrest-bucket-01
        endpoint: http://10.96.57.153:3900
        region: garage
        repoPath: /repo-01
        uriStyle: path
        verifyTLS: false
        retentionPolicy:
          full: 7
          fullType: count
          diff: 14
          archive: 2
          archiveType: full
          history: 30
        secretRef:
          accessKeyId:
            name: garage
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: garage
            key: ACCESS_SECRET_KEY
      - bucket: pgbackrest-bucket-02
        endpoint: http://10.96.57.153:3900
        region: garage
        repoPath: /repo-02
        uriStyle: path
        verifyTLS: false
        retentionPolicy:
          full: 2
          fullType: count
          diff: 7
          archive: 1
          archiveType: full
          history: 30
        secretRef:
          accessKeyId:
            name: garage
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: garage
            key: ACCESS_SECRET_KEY
