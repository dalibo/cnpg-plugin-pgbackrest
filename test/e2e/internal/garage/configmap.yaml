apiVersion: v1
kind: ConfigMap
metadata:
  name: config-garage
  namespace: default
data:
  garage.toml: |-
    metadata_dir = "/tmp/meta"
    data_dir = "/tmp/data"
    db_engine = "sqlite"
    
    replication_factor = 1
    
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "f958504d121f262cb255c5eefc114e9dc096405cb7ab005d1ddf5a4100056eef"
    
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"
    
    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"
    index = "index.html"
    
    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "f958504d121f262cb255c5eefc114e9dc096405cb7ab005d1ddf5a4100056eef"
    metrics_token = "f958504d121f262cb255c5eefc114e9dc096405cb7ab005d1ddf5a4100056eef"
